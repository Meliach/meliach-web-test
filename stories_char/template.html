
<div id="story-container">
  <h1 id="story-title"></h1>
  <table class="wikitable add-padding">
    <thead>
      <tr>
        <th style="width:20%"></th>
        <th style="width:80%"></th>
      </tr>
    </thead>
    <tbody id="story-content"></tbody>
  </table>
</div>

<style>
#story-container {
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin: 0 auto;
  overflow: auto;
  color: white;
  font-family: 'Urbanist', sans-serif;
}

#story-title {
  text-align: center;
  margin: 10px 0 20px;
  font-size: 36px;
  font-family: 'Silkscreen', sans-serif;
}

#story-container table {
  width: 100%;
  margin: 0 auto;
  border-collapse: collapse;
  table-layout: fixed;
  font-family: 'DotGothic16', sans-serif;
}

#story-container th,
#story-container td {
  padding: 12px;
  vertical-align: middle;
  overflow-wrap: break-word;
}

#story-container th {
  text-align: center;
}

#story-container .speaker {
  text-align: center;
}

#story-container .speaker img {
  width: 100%;
  max-width: 120px;
  height: auto;
  object-fit: contain;
  border-radius: 6px;
}

#story-container .dialogue {
  text-align: left;
  line-height: 1.6;
  white-space: pre-line;
}

#story-container .story-image {
  text-align: center;
}

#story-container .story-image img {
  display: block;
  width: 100%;
  height: auto;
  margin: 0 auto;
}
</style>

<script>

const PAGE_TITLE = "Catch a Fallen Star";

const STORY = [
{
type: "dialogue",
speaker: "Meli",
portrait: "https://placehold.co/120x120/34304a/ffffff?text=Icon",
text: 
`Well, you can call me Meli. It's nice to meet you! I hope we can get along.`
},

{
type: "image",
src: "https://placehold.co/1000x500/3b344b/ffffff?text=Test Image"
},

{
type: "dialogue",
portrait: "https://images4.imgbox.com/34/11/XcAZqqJN_o.png",
text: 
`This is a boy. Or not. This is a test image.

Yeah, I have to write shit sometime.`
},

{
type: "dialogue",
portrait: "https://images4.imgbox.com/34/11/XcAZqqJN_o.png",
text: 
`Wall of text, Wall of text, Wall of text, Wall of text, Wall of text, Wall of text,
Wall of text, Wall of text, Wall of text, Wall of text, Wall of text, Wall of text, 
Wall of text, Wall of text, Wall of text, Wall of text, Wall of text, Wall of text, 
Wall of text, Wall of text, Wall of text, Wall of text, 

Wall of text, Wall of text, Wall of text, Wall of text, 
Wall of text, Wall of text, Wall of text, Wall of text, `
},

{
type: "image",
src: "https://img.youtube.com/vi/fsM4BwIP1SQ/maxresdefault.jpg"
},

{
type: "dialogue",
speaker: "Meli",
portrait: "https://placehold.co/120x120/34304a/ffffff?text=Icon",
text: 
`WHJAT DAMN, IS THAT, IS THAT MR FUCKNG BEAST
Sorry Jimmy, I kinda jus copied the limbussy wiki, I need to see my kids...`
},

{
type: "dialogue",
speaker: "MrBeast",
portrait: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSsdPzGRUh4ZMyeeTGINi4OJf5Dr4fVSTiUSKhg9pRxSxCc8Nr5HErWHuY&s=10",
text: 
`WHAAAAAAATTTT?!??!?!?`
},

{
type: "image",
src: "https://i.ytimg.com/c_exp/Ugw8v3yugNO2uhuNWD94AaABAg/IMKk5V9ljNUfs_webp_animated_original_aspect_ratio.webp?sqp=CJLyj9gGGOCoAQ==&rs=AOn4CLBfPCqRqz8VPIpZsc5y_r70uvNIqw"
},

{
type: "dialogue",
portrait: "https://images4.imgbox.com/34/11/XcAZqqJN_o.png",
text: 
`And then, the universe was reset.`
},

];

document.getElementById("story-title").textContent = PAGE_TITLE;

const content = document.getElementById("story-content");

STORY.forEach(item => {
  const row = document.createElement("tr");

  if (item.type === "dialogue") {
    const speakerCell = document.createElement("td");
    speakerCell.className = "speaker";

    const portrait = document.createElement("img");
    portrait.src = item.portrait;
    portrait.alt = item.speaker;

    const name = document.createElement("b");
    name.textContent = item.speaker;

    speakerCell.appendChild(portrait);
    speakerCell.appendChild(document.createElement("br"));
    speakerCell.appendChild(name);

    const dialogueCell = document.createElement("td");
    dialogueCell.className = "dialogue";
    dialogueCell.textContent = item.text;

    row.appendChild(speakerCell);
    row.appendChild(dialogueCell);
  }

  else if (item.type === "image") {
    const imageCell = document.createElement("td");
    imageCell.colSpan = 2;
    imageCell.className = "story-image";

    const image = document.createElement("img");
    image.src = item.src;
    image.alt = "Story Scene";

    imageCell.appendChild(image);
    row.appendChild(imageCell);
  }

  content.appendChild(row);
});
</script>
